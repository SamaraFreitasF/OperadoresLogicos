<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Conforto Térmico: A Temperatura Está Ideal? </h1>

    Temperatura Ideal:
    <input type="text" id="input_temp"> <br>

    <button onclick="Ver()">Ver situação</button>
</body>
</html>

<script>
    function Ver(){
        var temp = Number(input_temp.value);

        if(temp >= 21 && temp <= 24){
            alert("Temperatura confortável :D");
        }else{
            alert("Temperatura DESCONFORTÁVEL :C");
        }
    }
</script>
